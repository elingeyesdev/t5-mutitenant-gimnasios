name: CI movil

on:
  pull_request:
    branches: [develop, main]
    paths: ['movil/**', 'global.json', '.github/workflows/movil.yml']
  push:
    branches: [develop, main]
    paths: ['movil/**', 'global.json', '.github/workflows/movil.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android
      - run: dotnet build movil/GestionGimnasios.Movil/GestionGimnasios.Movil.csproj -f net10.0-android -c Release
